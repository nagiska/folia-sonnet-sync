name: Android Build

on:
  pull_request:
    paths:
      - 'android/**'
      - 'src/**'
      - 'api/**'
      - 'api-ts/**'
      - 'shared/**'
      - 'sources/**'
      - 'packages/folium-source-kit/**'
      - 'dev/sources/**'
      - 'dev/appleMusic*.cjs'
      - 'dev/buildAppleMusicAndroidBridge.mjs'
      - 'test/unit/onlineMusic/androidSourceBridges.test.ts'
      - 'scripts/generate-android-assets.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'capacitor.config.ts'
      - '.github/workflows/android-build.yml'
  push:
    branches:
      - '**'
    paths:
      - 'android/**'
      - 'src/**'
      - 'api/**'
      - 'api-ts/**'
      - 'shared/**'
      - 'sources/**'
      - 'packages/folium-source-kit/**'
      - 'dev/sources/**'
      - 'dev/appleMusic*.cjs'
      - 'dev/buildAppleMusicAndroidBridge.mjs'
      - 'test/unit/onlineMusic/androidSourceBridges.test.ts'
      - 'scripts/generate-android-assets.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'capacitor.config.ts'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build and sync Capacitor web assets
        run: npm run cap:sync:android

      - name: Set up signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYSTORE_STORE_TYPE: ${{ secrets.ANDROID_KEYSTORE_STORE_TYPE }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing keystore configured; the debug APK will use the runner's throwaway debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/folia-release.p12
          cat > android/keystore.properties <<EOF
          storeType=$KEYSTORE_STORE_TYPE
          storeFile=folia-release.p12
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "Signing keystore installed."

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      # archive:false 时 artifact 名直接取文件名（name 参数被忽略），所以先把 APK 改成带 sha 的名字。
      - name: Name debug APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "folia-android-debug-${{ github.sha }}.apk"

      # archive:false：不打包 zip，产物就是裸 APK，下载后直接安装，免解压（upload-artifact v7 起支持）。
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          path: folia-android-debug-${{ github.sha }}.apk
          if-no-files-found: error
          archive: false
          retention-days: 14
